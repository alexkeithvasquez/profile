    <script>
      try {
        var stored = localStorage.getItem('akv-theme')
        var light =
          stored === 'light' ||
          (!stored && window.matchMedia('(prefers-color-scheme: light)').matches)
        if (light) {
          document.documentElement.classList.add('light')
          document.documentElement.style.colorScheme = 'light'
        }
      } catch (e) {}
    </script>
